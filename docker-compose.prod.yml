# Production overlay for hadalspace.com, with Let's Encrypt certificates.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# First time on a server: scripts/letsencrypt-init.sh issues the certificate
# (DNS for hadalspace.com and www.hadalspace.com must point at the server and
# ports 80/443 must be open). After that the certbot service renews it and
# nginx reloads every 6 hours to pick the renewal up.
#
# Settings come from .env (see production.env.example). Production secrets
# belong in a secrets manager that writes .env or the environment (CASA 6.7.1).

services:
  db:
    # Not reachable from outside the compose network in production.
    ports: !reset []

  backend:
    environment:
      OAUTH_REDIRECT_URI: https://${DOMAIN:-hadalspace.com}/api/auth/callback

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${DOMAIN:-hadalspace.com} www.${DOMAIN:-hadalspace.com}
      SSL_CERTIFICATE: /etc/letsencrypt/live/${CERT_NAME:-hadalspace.com}/fullchain.pem
      SSL_CERTIFICATE_KEY: /etc/letsencrypt/live/${CERT_NAME:-hadalspace.com}/privkey.pem
      HTTPS_REDIRECT_PORT_SUFFIX: ""
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-63072000}
      CERT_RELOAD_HOURS: "6"
    volumes: !override
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro

  # Renews the certificate when it is within 30 days of expiry (checked twice
  # a day) using the HTTP-01 webroot nginx serves on port 80.
  certbot:
    image: certbot/certbot:v4.1.1
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done

volumes:
  letsencrypt:
  certbot_webroot:
