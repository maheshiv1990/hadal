# CASA dependency policy (ASVS V14.2). Any change here must be mirrored in
# docs/casa/exceptions.md with a justification.

[graph]
all-features = false

[advisories]
# Every RUSTSEC advisory (vulnerability, unmaintained, unsound, yanked) fails the build.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licenses only; copyleft (GPL/AGPL/LGPL) is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crate is proprietary (publish = false); only third-party licenses are checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
