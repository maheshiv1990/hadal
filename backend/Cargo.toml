[package]
name = "hadal-backend"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
actix-web = { version = "4.20.0", default-features = false, features = ["macros"] }
anyhow = "1.0.105"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
base64 = "0.22"
dotenvy = "0.15.7"
getrandom = "0.3"
governor = "0.10.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
# AES-256-GCM for data at rest. Already in the tree as rustls' crypto provider.
ring = { version = "0.17", default-features = false, features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time"] }
subtle = "2"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.26"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1"

# CASA: lints enforced by `cargo clippy -- -D warnings` in scripts/verify.sh.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
