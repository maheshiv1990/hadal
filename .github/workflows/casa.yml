name: CASA gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: casa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  # Release tags must have every CASA requirement verified or n/a.
  CASA_STRICT: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

jobs:
  gate:
    name: verify.sh full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: frontend

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install semgrep
        run: pipx install semgrep

      - name: CASA gate
        run: scripts/verify.sh full

  dast:
    name: OWASP ZAP baseline
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nHTTP_PORT=8000\n' "$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -I -r report.html -J report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/
      - if: always()
        run: docker compose down -v
