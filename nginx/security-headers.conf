# Included in every nginx-served location (SPA, assets, API error page).
# Not applied to proxied /api/ responses: the backend sets its own stricter
# API headers there, and adding these too would send duplicate headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CASA 4.1.1. $hsts_header is defined in default.conf.template.
add_header Strict-Transport-Security $hsts_header always;
